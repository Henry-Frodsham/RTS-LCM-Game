stages:
  - setup
  - build

variables:
  PRODUCT_DIR: "product"
  VCPKG_ROOT: "${CI_PROJECT_DIR}/${PRODUCT_DIR}/vcpkg"
  VCPKG_BINARY_CACHE: "${CI_PROJECT_DIR}/${PRODUCT_DIR}/.vcpkg-cache"
  VCPKG_BINARY_SOURCES: "clear;files,${CI_PROJECT_DIR}/${PRODUCT_DIR}/.vcpkg-cache,readwrite"
  BUILD_DIR: "build"
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_DEFAULT_TRIPLET: "x64-linux"
  DEBIAN_FRONTEND: "noninteractive"

.linux:
  image: ubuntu:22.04
  cache:
    key: vcpkg-${CI_COMMIT_REF_SLUG}
    paths:
      - ${PRODUCT_DIR}/vcpkg/
      - ${PRODUCT_DIR}/.vcpkg-cache/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends build-essential git curl zip unzip tar pkg-config cmake ninja-build ca-certificates
    - apt-get clean
    - rm -rf /var/lib/apt/lists/*

setup:
  extends: .linux
  stage: setup
  script:
    - cd ${PRODUCT_DIR}
    - |
      if [ ! -d "vcpkg/.git" ]; then
        git clone https://github.com/microsoft/vcpkg.git
      else
        cd vcpkg && git pull && cd ..
      fi
    - cd vcpkg && ./bootstrap-vcpkg.sh -disableMetrics && cd ..
    - mkdir -p .vcpkg-cache
    - ./vcpkg/vcpkg install --x-manifest-root=. --x-install-root=./vcpkg_installed --binarysource="${VCPKG_BINARY_SOURCES}"
  artifacts:
    paths:
      - ${PRODUCT_DIR}/vcpkg/
      - ${PRODUCT_DIR}/vcpkg_installed/
      - ${PRODUCT_DIR}/.vcpkg-cache/
    expire_in: 1 week

build_debug:
  extends: .linux
  stage: build
  needs: [setup]
  script:
    - cd ${PRODUCT_DIR}
    - cmake -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" -G "Ninja"
    - cmake --build ${BUILD_DIR} --config Debug -j $(nproc)
  artifacts:
    paths:
      - ${PRODUCT_DIR}/${BUILD_DIR}/
    expire_in: 1 day

build_release:
  extends: .linux
  stage: build
  needs: [setup]
  script:
    - cd ${PRODUCT_DIR}
    - cmake -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" -G "Ninja"
    - cmake --build ${BUILD_DIR} --config Release -j $(nproc)
  artifacts:
    paths:
      - ${PRODUCT_DIR}/${BUILD_DIR}/
    expire_in: 1 week